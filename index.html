<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Buyurtmalari</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; }
        
        /* Stollar dizayni (2 qator uzunasiga) */
        .tables-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .table-card:hover { border-color: #4CAF50; transform: translateY(-2px); }
        .table-card.active { background-color: #e8f5e9; border-color: #4CAF50; }
        .table-number { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .table-total { font-size: 16px; color: #e74c3c; margin-top: 10px; font-weight: bold; }

        /* Modal (Oyna) dizayni */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: flex-end;
            z-index: 1000;
        }
        .modal {
            background: white; width: 100%; max-width: 600px;
            border-radius: 20px 20px 0 0; padding: 20px;
            max-height: 85vh; overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #7f8c8d; }

        /* Menyu elementlari */
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #ddd; }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-size: 16px; font-weight: 500; }
        .item-price { font-size: 14px; color: #7f8c8d; }
        
        .counter { display: flex; align-items: center; gap: 12px; }
        .btn-count { 
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: #f0f2f5; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn-count.minus { color: #e74c3c; }
        .btn-count.plus { color: #27ae60; background: #e8f5e9; }
        .count-display { font-size: 16px; font-weight: bold; width: 20px; text-align: center; }

        .modal-footer { margin-top: 20px; text-align: center; }
        .total-display { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
        
        .btn-clear {
            width: 100%; padding: 12px; background: #ff4757; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-bottom: 10px;
        }
        .btn-served {
            width: 100%; padding: 12px; background: #2ecc71; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-bottom: 10px;
        }
        .btn-again {
            width: 100%; padding: 12px; background: #f39c12; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>KAFE STOLLARI</h1>
    <div class="tables-container" id="tablesContainer">
        <!-- Stollar shu yerga JavaScript orqali joylanadi -->
    </div>

    <!-- Buyurtma oynasi -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">1-Stol buyurtmalari</div>
                <button class="close-btn" onclick="closeModal(true)">&times;</button>
            </div>
            
            <div id="menuContainer">
                <!-- Menyu shu yerga joylanadi -->
            </div>

            <div class="modal-footer">
                <div class="total-display">Umumiy: <span id="modalTotal">0</span> so'm</div>
                <button class="btn-clear" onclick="clearTable()">Stolni tozalash (O'chirish)</button>
                <button class="btn-served" onclick="markAsServed()">Buyurtma mijozga berildi</button>
                <button class="btn-again" onclick="markAsOrderedAgain()">Yana buyurtma berdi</button>
            </div>
        </div>
    </div>

    <script>
        // Menyu va narxlar
        const menu = [
            { id: 'q_somsa', name: 'Qopoq somsa', price: 15000 },
            { id: 't_somsa', name: 'Tomchi somsa', price: 15000 },
            { id: 'cola_025', name: 'Cola 0.25L', price: 6000 },
            { id: 'cola_05', name: 'Cola 0.5L', price: 8000 },
            { id: 'cola_1', name: 'Cola 1L', price: 15000 },
            { id: 'cola_15', name: 'Cola 1.5L', price: 18000 },
            { id: 'fanta_1', name: 'Fanta 1L', price: 15000 },
            { id: 'fanta_15', name: 'Fanta 1.5L', price: 18000 },
            { id: 'pepsi_175', name: 'Pepsi 1.75L', price: 20000 },
            { id: 'bezgaz_1', name: 'Bezgaz suv 1L', price: 6000 },
            { id: 'ark_tea_125', name: 'Ark tea 1.25L', price: 15000 }
        ];

        // Xotiradan oldingi buyurtmalarni va navbatni olish
        let orders = JSON.parse(localStorage.getItem('kafeOrders')) || {};
        let tableQueue = JSON.parse(localStorage.getItem('kafeQueue')) || [];
        
        // 12 ta stol uchun bo'sh obyektlar yaratish
        for (let i = 1; i <= 12; i++) {
            if (!orders[i]) orders[i] = {};
        }

        let currentTable = null;

        // Raqamlarni probel bilan chiroyli yozish uchun
        const formatMoney = (sum) => sum.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

        // Stollarni chizish (11-12, 9-10... tartibida)
        function renderTables() {
            const container = document.getElementById('tablesContainer');
            container.innerHTML = '';
            
            const tableOrder = [11, 12, 9, 10, 7, 8, 5, 6, 3, 4, 1, 2];
            
            tableOrder.forEach(i => {
                let total = calculateTableTotal(i);
                
                // Navbatni aniqlash
                let queueIndex = tableQueue.indexOf(i);
                let queueHtml = queueIndex !== -1 
                    ? `<span style="display:block; color:#d35400; font-size:15px; margin-top:5px; font-weight:900;">(${queueIndex + 1}-beriladi)</span>` 
                    : '';
                
                const card = document.createElement('div');
                card.className = `table-card ${total > 0 ? 'active' : ''}`;
                card.onclick = () => openModal(i);
                card.innerHTML = `
                    <div class="table-number">${i}-Stol</div>
                    <div class="table-total">
                        ${total > 0 ? formatMoney(total) + " so'm" + queueHtml : "Bo'sh"}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 1 ta stolning jami summasini hisoblash
        function calculateTableTotal(tableId) {
            let total = 0;
            const tableOrders = orders[tableId];
            for (const itemId in tableOrders) {
                const menuItem = menu.find(m => m.id === itemId);
                if (menuItem) {
                    total += menuItem.price * tableOrders[itemId];
                }
            }
            return total;
        }

        // Oynani ochish
        function openModal(tableId) {
            currentTable = tableId;
            document.getElementById('modalTitle').innerText = `${tableId}-Stol buyurtmalari`;
            renderMenu();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // Oynani yopish
        function closeModal(force = false) {
            if(force || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').style.display = 'none';
                renderTables();
            }
        }

        // Menyuni chizish va hisoblagichlarni ulash
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            
            menu.forEach(item => {
                const count = orders[currentTable][item.id] || 0;
                
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">${formatMoney(item.price)} so'm</span>
                    </div>
                    <div class="counter">
                        <button class="btn-count minus" onclick="updateCount('${item.id}', -1)">-</button>
                        <span class="count-display">${count}</span>
                        <button class="btn-count plus" onclick="updateCount('${item.id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            updateModalTotal();
        }

        // Soni o'zgarishi (- / +) va navbatni boshqarish
        function updateCount(itemId, change) {
            const beforeTotal = calculateTableTotal(currentTable);

            if (!orders[currentTable][itemId]) {
                orders[currentTable][itemId] = 0;
            }
            orders[currentTable][itemId] += change;
            
            if (orders[currentTable][itemId] < 0) {
                orders[currentTable][itemId] = 0;
            }

            const afterTotal = calculateTableTotal(currentTable);

            if (beforeTotal === 0 && afterTotal > 0) {
                if (!tableQueue.includes(currentTable)) {
                    tableQueue.push(currentTable);
                }
            } 
            else if (beforeTotal > 0 && afterTotal === 0) {
                tableQueue = tableQueue.filter(t => t !== currentTable);
            }

            saveData();
            renderMenu();
        }

        // Oynadagi jami summani yangilash
        function updateModalTotal() {
            const total = calculateTableTotal(currentTable);
            document.getElementById('modalTotal').innerText = formatMoney(total);
        }

        // Stolni butunlay tozalash
        function clearTable() {
            const conf = confirm(`${currentTable}-Stol buyurtmalarini o'chirmoqchimisiz?`);
            if (conf) {
                orders[currentTable] = {};
                tableQueue = tableQueue.filter(t => t !== currentTable);
                saveData();
                renderMenu();
            }
        }

        // "Buyurtma mijozga berildi" tugmasi funksiyasi
        function markAsServed() {
            if (tableQueue.includes(currentTable)) {
                tableQueue = tableQueue.filter(t => t !== currentTable);
                saveData();
                renderTables();
            }
        }

        // "Yana buyurtma berdi" tugmasi funksiyasi
        function markAsOrderedAgain() {
            const total = calculateTableTotal(currentTable);
            if (total > 0 && !tableQueue.includes(currentTable)) {
                tableQueue.push(currentTable);
                saveData();
                renderTables();
            }
        }

        // Ma'lumotlarni xotiraga saqlash
        function saveData() {
            localStorage.setItem('kafeOrders', JSON.stringify(orders));
            localStorage.setItem('kafeQueue', JSON.stringify(tableQueue));
        }

        // Dastlabki ishga tushirish
        renderTables();
    </script>
</body>
</html>
